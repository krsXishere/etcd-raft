# prometheus-rules.yml – Recording rules organized by metric cluster
#
# Setiap recording rule hanya menggunakan metrik yang benar-benar
# di-export oleh PrometheusObserver. Tidak ada metrik fiktif.
#
# ┌──────────────────────────────────────────────────────────────┐
# │ Parameter yang dikirim (Observer method → Prometheus metric) │
# ├────────────────────┬─────────────────────────────────────────┤
# │ RecordRTT          │ raft_adaptive_rtt_milliseconds     (G)  │
# │                    │ raft_adaptive_rtt_duration_seconds  (H)  │
# │ RecordController   │ raft_adaptive_rtt_avg_milliseconds  (G)  │
# │   Output           │ raft_adaptive_baseline_rtt_ms       (G)  │
# │                    │ raft_adaptive_controller_error_ms   (G)  │
# │                    │ raft_adaptive_controller_derivative  (G)  │
# │                    │ raft_adaptive_election_timeout_ms   (G)  │
# │                    │ raft_adaptive_heartbeat_interval_ms (G)  │
# │                    │ raft_state_current_term             (G)  │
# │                    │ raft_state_node_role                (G)  │
# │ RecordCommit       │ raft_throughput_committed_entries   (C)  │
# │ RecordProposal     │ raft_consensus_proposal_latency_s   (H)  │
# │   Latency          │   └ _count = proposals committed/failed  │
# │ RecordTuning       │ raft_overhead_tuning_duration_s     (H)  │
# │   Duration         │                                         │
# │ RecordRoleChange   │ raft_state_role_changes_total       (C)  │
# │                    │ raft_state_leader_elections_total    (C)  │
# │ RecordElection     │ raft_state_leader_election_dur_s    (H)  │
# │   Duration         │                                         │
# │ (built-in)         │ process_cpu_seconds_total           (C)  │
# │                    │ go_memstats_alloc_bytes             (G)  │
# └────────────────────┴─────────────────────────────────────────┘
#   G = Gauge, C = Counter, H = Histogram

groups:
  # ──────────────────────────────────────────────────────────────────
  # Cluster 1 — Adaptive Parameter Tuning
  # Sumber : raft_adaptive_rtt_duration_seconds (histogram)
  #          raft_adaptive_controller_error_milliseconds (gauge)
  # ──────────────────────────────────────────────────────────────────
  - name: cluster1_adaptive_parameter_tuning
    interval: 5s
    rules:
      - record: raft:adaptive:rtt_p50_seconds
        expr: >
          histogram_quantile(0.50,
            rate(raft_adaptive_rtt_duration_seconds_bucket[1m])
          )

      - record: raft:adaptive:rtt_p95_seconds
        expr: >
          histogram_quantile(0.95,
            rate(raft_adaptive_rtt_duration_seconds_bucket[1m])
          )

      - record: raft:adaptive:rtt_p99_seconds
        expr: >
          histogram_quantile(0.99,
            rate(raft_adaptive_rtt_duration_seconds_bucket[1m])
          )

  # ──────────────────────────────────────────────────────────────────
  # Cluster 2 — System Throughput
  # Sumber : raft_throughput_committed_entries_total (counter)
  #          raft_consensus_proposal_latency_seconds_count (dari histogram)
  # ──────────────────────────────────────────────────────────────────
  - name: cluster2_system_throughput
    interval: 5s
    rules:
      - record: raft:throughput:commits_per_second
        expr: >
          rate(raft_throughput_committed_entries_total[1m])

      - record: raft:throughput:cluster_commits_per_second
        expr: >
          sum(rate(raft_throughput_committed_entries_total[1m]))

      - record: raft:throughput:proposals_per_second
        expr: >
          rate(raft_consensus_proposal_latency_seconds_count{status="success"}[1m])

      - record: raft:throughput:proposal_success_rate
        expr: >
          rate(raft_consensus_proposal_latency_seconds_count{status="success"}[1m])
          /
          rate(raft_consensus_proposal_latency_seconds_count[1m])

  # ──────────────────────────────────────────────────────────────────
  # Cluster 3 — Consensus Latency (P50, P95, P99)
  # Sumber : raft_consensus_proposal_latency_seconds (histogram)
  # ──────────────────────────────────────────────────────────────────
  - name: cluster3_consensus_latency
    interval: 5s
    rules:
      - record: raft:consensus:proposal_latency_p50_seconds
        expr: >
          histogram_quantile(0.50,
            rate(raft_consensus_proposal_latency_seconds_bucket{status="success"}[1m])
          )

      - record: raft:consensus:proposal_latency_p95_seconds
        expr: >
          histogram_quantile(0.95,
            rate(raft_consensus_proposal_latency_seconds_bucket{status="success"}[1m])
          )

      - record: raft:consensus:proposal_latency_p99_seconds
        expr: >
          histogram_quantile(0.99,
            rate(raft_consensus_proposal_latency_seconds_bucket{status="success"}[1m])
          )

  # ──────────────────────────────────────────────────────────────────
  # Cluster 4 — Control Overhead
  # Sumber : raft_overhead_tuning_duration_seconds (histogram)
  #          process_cpu_seconds_total (built-in counter)
  #          go_memstats_alloc_bytes (built-in gauge)
  # ──────────────────────────────────────────────────────────────────
  - name: cluster4_control_overhead
    interval: 5s
    rules:
      - record: raft:overhead:tuning_duration_p50_seconds
        expr: >
          histogram_quantile(0.50,
            rate(raft_overhead_tuning_duration_seconds_bucket[1m])
          )

      - record: raft:overhead:tuning_duration_p99_seconds
        expr: >
          histogram_quantile(0.99,
            rate(raft_overhead_tuning_duration_seconds_bucket[1m])
          )

      - record: raft:overhead:cpu_usage_ratio
        expr: >
          rate(process_cpu_seconds_total[1m])

      - record: raft:overhead:memory_usage_bytes
        expr: >
          go_memstats_alloc_bytes

  # ──────────────────────────────────────────────────────────────────
  # Cluster 5 — Role & State Tracking
  # Sumber : raft_state_role_changes_total (counter)
  #          raft_state_leader_elections_total (counter)
  #          raft_state_leader_election_duration_seconds (histogram)
  #          raft_state_node_role (gauge)
  # ──────────────────────────────────────────────────────────────────
  - name: cluster5_role_state_tracking
    interval: 5s
    rules:
      - record: raft:state:role_changes_per_minute
        expr: >
          rate(raft_state_role_changes_total[1m]) * 60

      - record: raft:state:elections_per_minute
        expr: >
          sum(rate(raft_state_leader_elections_total[1m])) * 60

      - record: raft:state:election_duration_p95_seconds
        expr: >
          histogram_quantile(0.95,
            rate(raft_state_leader_election_duration_seconds_bucket[5m])
          )

      - record: raft:state:is_leader
        expr: >
          raft_state_node_role{role="leader"}
